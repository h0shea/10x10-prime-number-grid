<!DOCTYPE html>
<html>
    <head>
        <title>10x10 Prime Number Grid</title>
        <link rel="icon" type="image/x-icon" href="1010flavicon.png">
        <link rel="stylesheet" href="1010css.css">
    </head>

    <body onload="move(0)">
        <div id="main" class="main">
                <h1 id="table_ordinal" align="center" style="margin: 0 0 0.25em 0; font-family: helvetica;"></h1>
                <div class="inside">
                    <img src="left.svg" onclick="move(-1)" style="margin-right:10px;" id="previous"></img>
                    <table id="grid" class="box"></table>
                    <img src="right.svg" onclick="move(1)" style="margin-left:10px;" id="next"></img>
                </div>
                <p id="numberofprimes" style="font-family: arial; margin: 10px; text-align: center;"></p>
                <div id="table_buttons" class="table_buttons">
                    <input id="input" placeholder="Insert grid number..." type="number" min="0"></input>
                    <button onclick="enter()" id="enter">Enter</button>
                    <br>
                    <button onclick="reset()" style="margin-top:5px;">Reset</button>
                    <button onclick="random(1, 10000)" style="margin-top:5px;">Randomize Grid</button>
                </div>
            </div>
        </div>

        <div id="desc" class="desc">
            <h1 id="desc_ordinal" align="center" style="margin: 0 0 0.25em 0; font-family: helvetica;">#0</h1>
            <div class="box">
                <p id="n" style="font-size:40px; margin:0px; color:black; background-color:white; text-align:center; font-family:helvetica; margin: 0; padding: 5px;"><b><font face=helvetica>N</font></b></p>
                <p id="numbertype" style="background-color:silver; margin:0px; padding: 5px;"><font face=arial><b>Number:   </b></font></p>
                <p id="factors" style="background-color:#efefef; margin:0px; padding:5px;  "><font face=arial><b>Factors:   </b></font></p>
                <p id="primefactors" style="background-color:silver; margin:0px; padding:5px;  "><font face=arial><b>Prime Factorization:   </b></font></p>
            </div>
            <div class="desc_buttons">
                <button onclick="back()">Back to grid</button>
            </div>
        </div>
        

        <a href="http://h0shea.github.io/" style="text-decoration: none;">
            <img src="hm_black.png" style="margin: 0.5em; width: 2em; height: 2em;">
        </a>
    
        <script src="1010script.js"></script>
    </body>
</html>
